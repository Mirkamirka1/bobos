<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bobos</title>
<style>
:root{--ink:#14181f;--mut:#7a8494;--line:#e3e7ee;--bg:#eef1f6;--acc:#4f5bd5;--card:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px}
.box,dialog form{width:100%;max-width:340px;background:var(--card);padding:28px;border-radius:16px;display:grid;gap:12px;box-shadow:0 8px 30px #1b2a4a18}
.logo{font-size:36px;font-weight:800;letter-spacing:-1.5px;color:var(--acc)}
.box input,dialog input{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fafbfd}
.pri{background:var(--acc);color:#fff;padding:11px;border-radius:10px;font-weight:600}
.lnk{color:var(--acc);font-size:14px}
.err{color:#c93a3a;font-size:13px;min-height:18px}
dialog{border:0;border-radius:16px;margin:auto;padding:0;background:none}
dialog::backdrop{background:#0006}
dialog form{box-shadow:none}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.acct{display:flex;justify-content:space-between;align-items:center}
.acct b{font-size:20px;letter-spacing:-.5px;color:var(--acc)}
.acct>span{display:flex;gap:12px;align-items:center;color:var(--mut);font-size:13px}
.al{max-height:50vh;overflow:auto;display:grid}
.ar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top input{padding:9px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
#list{overflow:auto;flex:1;padding:6px}
.it{display:flex;gap:11px;align-items:center;width:100%;padding:9px;border-radius:12px;text-align:left}
.it:hover{background:var(--bg)}
.it.on{background:var(--acc);color:#fff}
.it.on span,.it.on time{color:#dfe2ff}
.tx{flex:1;min-width:0;display:grid}
.tx span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:stretch}
.rt time{color:var(--mut);font-size:12px}
.bd{background:var(--acc);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;font-weight:700;text-align:center}
.it.on .bd{background:#fff;color:var(--acc)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.none{padding:18px;color:var(--mut);text-align:center}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header .av{width:38px;height:38px}
#back{display:none;font-size:26px;color:var(--acc);padding:0 6px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:5px}
.m{max-width:min(78%,520px);padding:7px 11px;border-radius:14px 14px 14px 4px;background:var(--card);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px}
.m .who{display:block;font-size:12px;font-weight:700;color:var(--acc)}
.m time{margin-left:8px;font-size:11px;opacity:.6;white-space:nowrap}
#f{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
#t{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:22px;background:var(--bg)}
#f .pri{border-radius:22px;padding:0 20px}
@media(max-width:700px){
 #app{grid-template-columns:1fr}
 main{display:none}
 #app.open aside{display:none}
 #app.open main{display:flex}
 #back{display:block}
}
</style>
</head>
<body>

<div id="auth">
  <form class="box" id="af">
    <div class="logo">bobos</div>
    <input id="lg" placeholder="Логин" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button class="pri" id="go">Войти</button>
    <button type="button" class="lnk" id="sw">Нет аккаунта? Создать</button>
  </form>
</div>

<div id="app" class="hide">
  <aside>
    <div class="top">
      <div class="acct"><b>bobos</b><span><button class="lnk" id="me" title="Профиль"></button><button class="lnk hide" id="ad">Админка</button><button class="lnk" id="out">Выйти</button></span></div>
      <input id="q" placeholder="Поиск по username или ID" autocomplete="off">
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <header><button id="back" aria-label="Назад">‹</button><div id="hav"></div><b id="ttl"></b></header>
    <div id="msgs"></div>
    <form id="f"><input id="t" placeholder="Сообщение" maxlength="2000" autocomplete="off"><button class="pri">Отправить</button></form>
  </main>
</div>

<dialog id="dlg">
  <form id="pf">
    <b>Профиль</b>
    <div>Твой ID: <b id="pid"></b></div>
    <div>Статус: <b id="pst"></b></div>
    <input id="nu" placeholder="username" maxlength="20" autocomplete="off">
    <div class="err" id="perr">Латиница, цифры и _ (3–20 символов)</div>
    <button class="pri">Сохранить</button>
    <button type="button" class="lnk" id="pc">Закрыть</button>
  </form>
</dialog>

<dialog id="adm">
  <form id="af2">
    <b>Админка: доверенные пользователи</b>
    <div class="al" id="al"></div>
    <button type="button" class="lnk" id="ac">Закрыть</button>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,getDoc,getDocs,updateDoc,runTransaction,writeBatch,query,where,orderBy,limit,limitToLast,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCwsNo4Xk9kT2ZjgnRIh5L4pbt8d-A9o1Y",
  authDomain:"bobos-14e75.firebaseapp.com",
  projectId:"bobos-14e75",
  storageBucket:"bobos-14e75.firebasestorage.app",
  messagingSenderId:"752382858385",
  appId:"1:752382858385:web:c81d808d578f3c7943db30"
});
const auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const av=n=>{const a=el('div','av',n[0].toUpperCase());a.style.background=`hsl(${hue(n)} 50% 52%)`;return a};
const hm=t=>t?t.toDate().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';
const UN=/^[a-z0-9_]{3,20}$/,ADMIN=1000;

let me=null,cur=null,chats=[],unMsgs=null,unChats=null,reg=false;
let unread={},ac=null,asked=false;

/* ---------- уведомления (пока открыта вкладка) ---------- */
document.addEventListener('click',()=>{
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(!asked&&'Notification' in window&&Notification.permission==='default'){asked=true;Notification.requestPermission()}
});
function beep(){try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch{}}
function badge(){const n=Object.values(unread).reduce((a,b)=>a+b,0);document.title=(n?`(${n}) `:'')+'bobos'}
function notify(id,title,text){
  if(cur?.id===id&&!document.hidden) return;
  unread[id]=(unread[id]||0)+1;badge();if(!$('#q').value)renderList();beep();
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    const n=new Notification(title,{body:text,tag:id});n.onclick=()=>{window.focus();n.close()};
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&cur){delete unread[cur.id];badge();if(!$('#q').value)renderList()}
});

/* ---------- вход ---------- */
$('#sw').onclick=()=>{
  reg=!reg;
  $('#go').textContent=reg?'Создать аккаунт':'Войти';
  $('#sw').textContent=reg?'Уже есть аккаунт? Войти':'Нет аккаунта? Создать';
  $('#err').textContent='';
};
$('#af').onsubmit=async e=>{
  e.preventDefault();
  const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value,err=$('#err');
  if(!UN.test(l)) return err.textContent='Логин: 3–20 символов, латиница, цифры и _';
  err.textContent='Подождите…';
  try{
    const em=l+'@bobos.app';
    if(reg) await createUserWithEmailAndPassword(auth,em,p);
    else await signInWithEmailAndPassword(auth,em,p);
  }catch(x){
    err.textContent=({
      'auth/email-already-in-use':'Логин занят',
      'auth/invalid-credential':'Неверный логин или пароль',
      'auth/weak-password':'Пароль минимум 6 символов',
      'auth/operation-not-allowed':'В Firebase не включён Email/Password',
      'auth/too-many-requests':'Слишком много попыток, подожди немного'
    })[x.code]||x.code;
  }
};
$('#out').onclick=()=>signOut(auth);

/* ---------- профиль: числовой ID и username ---------- */
async function ensureProfile(u){
  const login=u.email.split('@')[0],ref=doc(db,'users',u.uid);
  const p=(await getDoc(ref)).data()||{};
  if(!p.bobosId){
    const cref=doc(db,'meta','counter');
    p.bobosId=await runTransaction(db,async t=>{
      const c=await t.get(cref),id=c.exists()?c.data().n+1:1000;
      t.set(cref,{n:id});
      t.set(ref,{bobosId:id,name:login},{merge:true});
      return id;
    });
  }
  if(!p.username){
    let un=login;
    for(let i=0;i<6;i++){
      try{
        const b=writeBatch(db);
        b.set(doc(db,'usernames',un),{uid:u.uid});
        b.set(ref,{username:un,usernameLower:un},{merge:true});
        await b.commit();p.username=un;break;
      }catch{un=login+(100+Math.floor(Math.random()*900))}
    }
  }
  return p;
}
$('#me').onclick=()=>{$('#pst').textContent=me.id===ADMIN?'Админ':me.trusted?'Доверенный ✓':'Обычный';$('#pid').textContent=me.id;$('#nu').value=me.username;$('#dlg').showModal()};
$('#pc').onclick=()=>$('#dlg').close();
$('#pf').onsubmit=async e=>{
  e.preventDefault();
  const n=$('#nu').value.trim().toLowerCase(),er=$('#perr');
  if(n===me.username) return $('#dlg').close();
  if(!UN.test(n)) return er.textContent='Латиница, цифры и _ (3–20 символов)';
  try{
    const b=writeBatch(db);
    b.delete(doc(db,'usernames',me.username));
    b.set(doc(db,'usernames',n),{uid:me.uid});
    b.set(doc(db,'users',me.uid),{username:n,usernameLower:n},{merge:true});
    await b.commit();
    me.username=n;$('#me').textContent='@'+n;$('#dlg').close();
  }catch{er.textContent='Не получилось: username занят или нет связи'}
};

/* ---------- админка (ID 1000) ---------- */
$('#ac').onclick=()=>$('#adm').close();
$('#ad').onclick=()=>{$('#adm').showModal();loadAdmin()};
async function loadAdmin(){
  const box=$('#al');box.replaceChildren(el('div','none','Загрузка…'));
  const s=await getDocs(query(collection(db,'users'),limit(200)));
  box.replaceChildren();
  const us=s.docs.filter(d=>d.id!==me.uid&&d.data().username);
  if(!us.length) return box.append(el('div','none','Других пользователей пока нет'));
  us.forEach(d=>{
    const u=d.data(),r=el('div','ar'),t=el('div','tx');
    t.append(el('b',0,'@'+u.username+(u.trusted?' ✓':'')),el('span',0,'ID '+u.bobosId));
    const b=el('button','lnk',u.trusted?'Снять доверие':'Сделать доверенным');
    b.onclick=async()=>{
      b.disabled=true;
      try{await updateDoc(doc(db,'users',d.id),{trusted:!u.trusted})}catch(x){alert('Не вышло: '+x.code)}
      loadAdmin();
    };
    r.append(t,b);box.append(r);
  });
}

/* ---------- список чатов ---------- */
function item(title,sub,time,on,click,n){
  const b=el('button','it'+(on?' on':''));
  const t=el('div','tx');t.append(el('b',0,title),el('span',0,sub));
  const r=el('div','rt');r.append(el('time',0,time));
  if(n) r.append(el('i','bd',n));
  b.append(av(title),t,r);b.onclick=click;return b;
}
const ms=c=>c.lastTs?.toMillis?.()??Date.now();
function dm(c){
  const other=c.members.find(x=>x!==me.uid);
  return {title:c.names?.[other]||'Диалог',meta:{members:c.members,names:c.names}};
}
function renderList(){
  const box=$('#list');box.replaceChildren();
  if(!chats.length) box.append(el('div','none','Диалогов пока нет. Найди человека по username или ID.'));
  [...chats].sort((a,b)=>ms(b)-ms(a)).forEach(c=>{
    const d=dm(c);
    box.append(item(d.title,c.lastText||'',hm(c.lastTs),cur?.id===c.id,()=>openChat(c.id,d.title,d.meta,true),unread[c.id]));
  });
}

/* ---------- поиск: username или ID ---------- */
let st;
$('#q').oninput=e=>{
  clearTimeout(st);
  const q=e.target.value.trim().toLowerCase().replace(/^@/,'');
  if(!q) return renderList();
  st=setTimeout(async()=>{
    const users=collection(db,'users');
    const qq=/^\d+$/.test(q)
      ? query(users,where('bobosId','==',Number(q)),limit(8))
      : query(users,where('usernameLower','>=',q),where('usernameLower','<=',q+'\uf8ff'),limit(8));
    const s=await getDocs(qq);
    const box=$('#list');box.replaceChildren();
    const us=s.docs.filter(d=>d.id!==me.uid&&d.data().username);
    if(!us.length) return box.append(el('div','none','Никого не нашли'));
    us.forEach(d=>{
      const u=d.data();
      box.append(item(u.username+(u.trusted?' ✓':''),'ID '+u.bobosId,'',false,()=>{
        $('#q').value='';
        const members=[me.uid,d.id].sort();
        openChat(members.join('_'),u.username,{members,names:{[me.uid]:me.username,[d.id]:u.username}},true);
      }));
    });
  },250);
};

/* ---------- переписка ---------- */
function openChat(id,title,meta,show){
  cur={id,title,meta};
  delete unread[id];badge();
  unMsgs&&unMsgs();
  $('#ttl').textContent=title;
  $('#hav').replaceChildren(av(title));
  const other=meta.members.find(x=>x!==me.uid);
  getDoc(doc(db,'users',other)).then(s=>{if(cur?.id===id&&s.data()?.trusted)$('#ttl').textContent=title+' ✓'}).catch(()=>{});
  $('#msgs').replaceChildren();
  $('#f').classList.remove('hide');
  if(show) $('#app').classList.add('open');
  renderList();
  unMsgs=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('ts'),limitToLast(100)),s=>{
    const box=$('#msgs');box.replaceChildren();
    s.docs.forEach(d=>{
      const m=d.data(),mine=m.from===me.uid;
      const b=el('div','m'+(mine?' me':''));
      b.append(el('span',0,m.text),el('time',0,hm(m.ts)));
      box.append(b);
    });
    box.scrollTop=box.scrollHeight;
  },console.error);
}
$('#back').onclick=()=>$('#app').classList.remove('open');
function emptyView(){
  cur=null;unMsgs&&unMsgs();unMsgs=null;
  $('#ttl').textContent='';$('#hav').replaceChildren();
  $('#msgs').replaceChildren(el('div','none','Выбери диалог слева или найди человека по username или ID.'));
  $('#f').classList.add('hide');
}

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const i=$('#t'),text=i.value.trim();
  if(!text||!cur) return;
  i.value='';
  try{
    await setDoc(doc(db,'chats',cur.id),{
      members:cur.meta.members,names:{...cur.meta.names,[me.uid]:me.username},
      lastText:text.slice(0,80),lastFrom:me.username,lastUid:me.uid,lastTs:serverTimestamp()
    },{merge:true});
    await addDoc(collection(db,'chats',cur.id,'messages'),{from:me.uid,name:me.username,text,ts:serverTimestamp()});
  }catch(x){console.error(x);alert('Не отправилось: '+x.code)}
};

/* ---------- старт ---------- */
onAuthStateChanged(auth,async u=>{
  unChats&&unChats();unMsgs&&unMsgs();
  if(!u){
    me=null;cur=null;unread={};badge();
    $('#app').classList.add('hide');$('#auth').classList.remove('hide');
    return;
  }
  let p;
  try{p=await ensureProfile(u)}catch(x){console.error(x);$('#err').textContent='Не удалось загрузить профиль: '+(x.code||x.message);signOut(auth);return}
  me={uid:u.uid,username:p.username,id:p.bobosId,trusted:!!p.trusted};
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  $('#me').textContent='@'+me.username;
  $('#ad').classList.toggle('hide',me.id!==ADMIN);

  let first=true;
  unChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!first) s.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type!=='removed'&&d.lastUid&&d.lastUid!==me.uid&&!ch.doc.metadata.hasPendingWrites) notify(ch.doc.id,d.lastFrom||'bobos',d.lastText||'');
    });
    first=false;
    if(!$('#q').value) renderList();
  },console.error);

  emptyView();
});
</script>
</body>
</html>
