<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bobos</title>
<style>
:root{--ink:#14181f;--mut:#7a8494;--line:#e3e7ee;--bg:#eef1f6;--acc:#4f5bd5;--card:#fff;--inp:#fafbfd;color-scheme:light}
:root[data-theme=dark]{--ink:#e8ebf2;--mut:#8b95a7;--line:#2a3140;--bg:#0f131a;--card:#171c26;--inp:#1f2532;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:root{accent-color:var(--acc)}
input{caret-color:var(--acc)}
input:focus,input:focus-visible{outline:2px solid var(--acc);outline-offset:0}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
#auth{height:100%;display:grid;place-items:center;padding:20px}
.box,dialog form{width:100%;max-width:340px;background:var(--card);padding:28px;border-radius:16px;display:grid;gap:12px;box-shadow:0 8px 30px #1b2a4a18}
.logo{font-size:36px;font-weight:800;letter-spacing:-1.5px;color:var(--acc)}
.box input,dialog input{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--inp)}
.pri{background:var(--acc);color:#fff;padding:11px;border-radius:10px;font-weight:600}
.lnk{color:var(--acc);font-size:14px}
.err{color:#c93a3a;font-size:13px;min-height:18px}
dialog{border:0;border-radius:16px;margin:auto;padding:0;background:none;color:var(--ink)}
dialog::backdrop{background:#0006}
dialog form{box-shadow:none;max-height:90vh;overflow:auto}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.acct{display:flex;justify-content:space-between;align-items:center}
.acct b{font-size:20px;letter-spacing:-.5px;color:var(--acc)}
.acct>span{display:flex;gap:12px;align-items:center;color:var(--mut);font-size:13px}
.al{max-height:50vh;overflow:auto;display:grid}
.ar{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:2px 14px}
.top input{padding:9px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
#list{overflow:auto;flex:1;padding:6px}
.it{display:flex;gap:11px;align-items:center;width:100%;padding:9px;border-radius:12px;text-align:left}
.it:hover{background:var(--bg)}
.it.on{background:var(--acc);color:#fff}
.it.on span,.it.on time{color:#ffffffc8}
.tx{flex:1;min-width:0;display:grid}
.tx span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:stretch}
.rt time{color:var(--mut);font-size:12px}
.bd{background:var(--acc);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;font-weight:700;text-align:center}
.it.on .bd{background:#fff;color:var(--acc)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.none{padding:18px;color:var(--mut);text-align:center}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
header{display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header .av{width:38px;height:38px}
#back{display:none;font-size:26px;color:var(--acc);padding:0 6px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:5px}
.m{max-width:min(78%,520px);padding:7px 11px;border-radius:14px 14px 14px 4px;background:var(--card);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-radius:14px 14px 4px 14px}
.m .who{display:block;font-size:12px;font-weight:700;color:var(--acc)}
.m time{margin-left:8px;font-size:11px;opacity:.6;white-space:nowrap}
#f{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
#t{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:22px;background:var(--bg)}
#f .pri{border-radius:22px;padding:0 20px}
hr{border:0;border-top:1px solid var(--line);width:100%}
.mut{color:var(--mut);font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.sw input{padding:0;border:0;width:30px;height:30px;background:none;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--acc);color:#fff;border-radius:14px;padding:3px 10px;font-size:13px}
.ht{display:grid;line-height:1.2}
.ht small{color:var(--mut);font-size:12px}
#ng{justify-self:start}
.vb{width:1.15em;height:1.15em;fill:var(--acc);vertical-align:-.22em;flex:none}
.it.on .vb{fill:#fff}
.av{position:relative}
.av.onl::after{content:'';position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.it.on .av.onl::after{background:#fff;border-color:var(--acc)}
#sub.onl,#ups.onl{color:var(--acc)}
.tk{display:inline-block;margin-left:4px;opacity:.6;vertical-align:-.28em;line-height:0}
.tk svg{width:1.25em;height:1.25em;fill:currentColor}
.tk.rd{opacity:1}
.gedit{display:grid;gap:10px}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--bg);color:var(--acc)}
.ib svg{width:26px;height:26px;fill:currentColor}
.big{font-size:19px}
.lnk.dng{color:#c93a3a}
.rp{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line)}
.rp .rpt{flex:1;min-width:0;display:grid;border-left:3px solid var(--acc);padding-left:8px}
.rp b{color:var(--acc);font-size:13px}
.rp span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp button{font-size:22px;color:var(--mut);padding:0 6px}
.q{display:block;border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:4px;border-radius:4px;background:#0000001a;cursor:pointer;font-size:13px}
.m.me .q{border-left-color:#fff;background:#ffffff26}
.q b{display:block;color:var(--acc);font-size:12px}
.m.me .q b{color:#fff}
.q span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.m.hl{animation:hl 1.4s}
@keyframes hl{0%,60%{outline:2px solid var(--acc)}100%{outline:2px solid transparent}}
#mm{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0003;padding:4px}
#mm button{display:block;padding:8px 16px;border-radius:8px;color:var(--ink);white-space:nowrap}
#mm button:hover{background:var(--bg)}
.up{text-align:center;justify-items:center}
.up .av{width:96px;height:96px;font-size:38px}
.up .pri{width:100%}
.who{cursor:pointer}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avrow{display:flex;gap:14px;align-items:center}
.avrow .col{display:grid;gap:4px;justify-items:start}
.avrow .av{width:64px;height:64px;font-size:26px}
@media(max-width:700px){
 #app{grid-template-columns:1fr}
 main{display:none}
 #app.open aside{display:none}
 #app.open main{display:flex}
 #back{display:block}
}
</style>
</head>
<body>

<div id="auth">
  <form class="box" id="af">
    <div class="logo">bobos</div>
    <input id="lg" placeholder="Логин" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="err"></div>
    <button class="pri" id="go">Войти</button>
    <button type="button" class="lnk" id="sw">Нет аккаунта? Создать</button>
  </form>
</div>

<div id="app" class="hide">
  <aside>
    <div class="top">
      <div class="acct"><b>bobos</b><button class="ib" id="set" aria-label="Настройки" title="Настройки"><svg viewBox="0 -960 960 960"><path d="m388-80-20-126q-19-7-40-19t-37-25l-118 54-93-164 108-79q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521L80-600l93-164 118 54q16-13 37-25t40-18l20-127h184l20 126q19 7 40.5 18.5T669-710l118-54 93 164-108 77q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l108 78-93 164-118-54q-16 13-36.5 25.5T592-206L572-80H388Zm48-60h88l14-112q33-8 62.5-25t53.5-41l106 46 40-72-94-69q4-17 6.5-33.5T715-480q0-17-2-33.5t-7-33.5l94-69-40-72-106 46q-23-26-52-43.5T538-708l-14-112h-88l-14 112q-34 7-63.5 24T306-642l-106-46-40 72 94 69q-4 17-6.5 33.5T245-480q0 17 2.5 33.5T254-413l-94 69 40 72 106-46q24 24 53.5 41t62.5 25l14 112Zm44-210q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Zm0-130Z"/></svg></button></div>
      <input id="q" placeholder="Поиск по username или ID" autocomplete="off">
      <button class="lnk" id="ng" type="button">＋ Новая группа</button>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <header id="hd"><button id="back" aria-label="Назад">‹</button><div id="hav"></div><div class="ht"><b id="ttl"></b><small id="sub"></small></div></header>
    <div id="msgs"></div>
    <div id="rp" class="rp hide"><div class="rpt"><b id="rpn"></b><span id="rps"></span></div><button type="button" id="rpx" aria-label="Отмена">×</button></div>
    <form id="f"><input id="t" placeholder="Сообщение" maxlength="2000" autocomplete="off"><button class="pri">Отправить</button></form>
  </main>
</div>

<div id="mm" class="hide"></div>

<dialog id="dlg">
  <form id="pf">
    <div class="avrow">
      <div id="mav"></div>
      <div class="col"><b class="big" id="me"></b><div class="mut">ID <b id="pid"></b> · <b id="pst"></b></div></div>
    </div>
    <div class="avrow"><button type="button" class="lnk" id="avb">Загрузить фото</button><button type="button" class="lnk" id="avd">Убрать фото</button></div>
    <input type="file" id="avf" accept="image/*" hidden>
    <div class="mut">Username</div>
    <input id="nu" placeholder="username" maxlength="20" autocomplete="off">
    <div class="err" id="perr">Латиница, цифры и _ (3–20 символов)</div>
    <button class="pri">Сохранить username</button>
    <hr>
    <b>Кастомизация</b>
    <div class="mut">Тема</div>
    <div class="seg" id="th"><button type="button" data-v="auto">Авто</button><button type="button" data-v="light">Светлая</button><button type="button" data-v="dark">Тёмная</button><button type="button" data-v="accent">Цвет</button></div>
    <div class="mut">Акцентный цвет</div>
    <div class="sw" id="sw2"></div>
    <hr>
    <button type="button" class="lnk hide" id="ad">Админка</button>
    <button type="button" class="lnk dng" id="out">Выйти из аккаунта</button>
    <button type="button" class="lnk" id="pc">Закрыть</button>
  </form>
</dialog>

<dialog id="gd">
  <form id="gf">
    <b>Новая группа</b>
    <input id="gt" placeholder="Название группы" maxlength="40" autocomplete="off">
    <div class="chips" id="gs"></div>
    <input id="gq" placeholder="Добавить: username или ID" autocomplete="off">
    <div class="al" id="gr"></div>
    <div class="err" id="gerr"></div>
    <button class="pri">Создать</button>
    <button type="button" class="lnk" id="gc">Отмена</button>
  </form>
</dialog>

<dialog id="up">
  <form method="dialog" class="up">
    <div id="upa"></div>
    <b id="upn" style="font-size:19px"></b>
    <div class="mut" id="upi"></div>
    <div class="mut" id="ups"></div>
    <button type="button" class="pri" id="upw">Написать</button>
    <button class="lnk">Закрыть</button>
  </form>
</dialog>

<dialog id="gi">
  <form method="dialog">
    <div class="avrow"><div id="gav"></div><b id="git"></b></div>
    <div class="gedit hide" id="ged">
      <input id="gtn" placeholder="Название группы" maxlength="40" autocomplete="off">
      <button type="button" class="pri" id="gsv">Сохранить название</button>
      <div class="avrow"><button type="button" class="lnk" id="gab">Сменить фото</button><button type="button" class="lnk" id="gad">Убрать фото</button></div>
      <input type="file" id="gaf" accept="image/*" hidden>
      <input id="gaq" placeholder="Добавить: username или ID" autocomplete="off">
      <div class="al" id="gar"></div>
    </div>
    <div class="mut">Участники</div>
    <div class="al" id="gil"></div>
    <div class="err" id="gier"></div>
    <button class="lnk">Закрыть</button>
  </form>
</dialog>

<dialog id="adm">
  <form id="af2">
    <b>Админка</b>
    <div class="al" id="al"></div>
    <button type="button" class="lnk" id="ac">Закрыть</button>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {initializeFirestore,collection,doc,setDoc,addDoc,getDoc,getDocs,updateDoc,arrayUnion,increment,runTransaction,writeBatch,query,where,orderBy,limit,limitToLast,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCwsNo4Xk9kT2ZjgnRIh5L4pbt8d-A9o1Y",
  authDomain:"bobos-14e75.firebaseapp.com",
  projectId:"bobos-14e75",
  storageBucket:"bobos-14e75.firebasestorage.app",
  messagingSenderId:"752382858385",
  appId:"1:752382858385:web:c81d808d578f3c7943db30"
});
const auth=getAuth(app),db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const hue=s=>Math.abs([...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const av=(n,src)=>{
  if(typeof src==='string'&&src.startsWith('data:image/jpeg;base64,')){const a=el('div','av'),i=el('img');i.src=src;i.alt='';a.append(i);return a}
  const a=el('div','av',n[0].toUpperCase());a.style.background=`hsl(${hue(n)} 50% 52%)`;return a;
};
const hm=t=>t?t.toDate().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';
const UN=/^[a-z0-9_]{3,20}$/,ADMIN=1000;
const VBP="m346-60-76-130-151-31 17-147-96-112 96-111-17-147 151-31 76-131 134 62 134-62 77 131 150 31-17 147 96 111-96 112 17 147-150 31-77 130-134-62-134 62Zm27-79 107-45 110 45 67-100 117-30-12-119 81-92-81-94 12-119-117-28-69-100-108 45-110-45-67 100-117 28 12 119-81 94 81 92-12 121 117 28 70 100Zm107-341Zm-43 133 227-225-45-41-182 180-95-99-46 45 141 140Z",STP="m323-245 157-94 157 95-42-178 138-120-182-16-71-168-71 167-182 16 138 120-42 178Zm-90 125 65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-355Z",SNP="M450-80v-95l-73 62-39-46 112-94v-175l-151 87-26 145-59-11 17-94-82 47-30-52 82-47-90-33 20-56 138 49 150-87-150-86-138 49-20-56 90-33-82-48 30-52 82 48-17-94 59-11 26 145 151 87v-175l-112-94 39-46 73 62v-96h60v96l72-62 39 46-111 94v175l150-87 26-145 59 11-17 94 82-47 30 53-82 46 90 33-20 56-138-49-150 86 150 87 138-49 20 56-90 33 83 47-30 52-83-47 17 94-59 11-26-145-150-87v175l111 94-39 46-72-62v95h-60Z",BTP="M480-80 120-286v-399l360-195 360 195v399L480-80ZM366-578q23-23 52.5-37.5T480-630q32 0 61.5 14.5T594-578l153-90-267-142-267 142 153 90Zm84 412v-167q-52-14-86-54t-34-93q0-11 1.5-22.5T337-525l-157-93v297l270 155Zm94-250q26-26 26-64t-26-64q-26-26-64-26t-64 26q-26 26-26 64t26 64q26 26 64 26t64-26Zm-34 250 270-155v-297l-157 93q4 11 5.5 22.5T630-480q0 53-34 93t-86 54v167Z";
const mk=(d,l)=>{const w=document.createElement('span');w.innerHTML=`<svg class="vb" viewBox="0 -960 960 960" aria-label="${l}"><path d="${d}"/></svg>`;return w.firstChild};
const marks=u=>{
  if(!u) return [];
  const r=[];
  if(u.bobosId===ADMIN) r.push(' ',mk(STP,'владелец')); else if(u.trusted) r.push(' ',mk(VBP,'доверенный'));
  if(u.beta) r.push(' ',mk(BTP,'бетатестер'));
  if(u.frozen) r.push(' ',mk(SNP,'заморожен'));
  return r;
};
const role=u=>u.bobosId===ADMIN?'Владелец':u.admin?'Админ':u.trusted?'Доверенный':'Обычный';
const CHP="M378-246 154-470l43-43 181 181 384-384 43 43-427 427Z",DAP="M294-242 70-466l43-43 181 181 43 43-43 43Zm170 0L240-466l43-43 181 181 384-384 43 43-427 427Zm0-170-43-43 257-257 43 43-257 257Z";
const tickSvg=rd=>`<svg viewBox="0 -960 960 960"><path d="${rd?DAP:CHP}"/></svg>`;
const online=u=>{const t=u?.lastSeen?.toMillis?.();return !!t&&Date.now()-t<150000};
const seen=u=>{const t=u?.lastSeen?.toMillis?.();return t?new Date(t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''};

let me=null,cur=null,chats=[],unMsgs=null,unChats=null,reg=false;
let unread={},ac=null,asked=false;
const ucd={};
function loadUser(uid){
  return ucd[uid]?Promise.resolve(ucd[uid]):getDoc(doc(db,'users',uid)).then(s=>ucd[uid]=s.data()||{}).catch(()=>({}));
}
let hb=null,tick=null,unMe=null,replyTo=null;
const lts={},unU={},marking=new Set();

/* ---------- присутствие ---------- */
const beat=()=>{if(me&&!document.hidden)setDoc(doc(db,'users',me.uid),{lastSeen:serverTimestamp()},{merge:true}).catch(()=>{})};
function paintFrozen(){
  const f=!!me?.frozen;
  $('#t').disabled=f;$('#t').placeholder=f?'Аккаунт заморожен: писать нельзя':'Сообщение';
  $('#f .pri').disabled=f;$('#ng').disabled=f;
}
function watch(uid){
  if(!uid||unU[uid]) return;
  unU[uid]=onSnapshot(doc(db,'users',uid),s=>{
    ucd[uid]=s.data()||{};
    if(!$('#q').value) renderList();
    if(cur&&!cur.meta.group&&cur.meta.members.includes(uid)) paintHead();
  },()=>{});
}
function paintHead(){
  if(!cur) return;
  const m=cur.meta,sub=$('#sub');
  if(m.group){
    $('#hav').replaceChildren(av(cur.title,m.avatar));$('#ttl').textContent=cur.title;
    sub.textContent=m.members.length+' участн.';sub.classList.remove('onl');return;
  }
  const o=ucd[m.members.find(x=>x!==me.uid)]||{},on=online(o);
  $('#hav').replaceChildren(av(cur.title,o.avatar));
  $('#ttl').replaceChildren(o.deleted?'Удалённый аккаунт':(o.username||cur.title),...marks(o));
  sub.textContent=on?'в сети':'не в сети';sub.classList.toggle('onl',on);
}

/* ---------- прочитано / не прочитано ---------- */
function markRead(id){
  if(marking.has(id)) return;
  marking.add(id);
  setDoc(doc(db,'chats',id),{unread:{[me.uid]:0},reads:{[me.uid]:serverTimestamp()}},{merge:true})
    .catch(console.error).finally(()=>setTimeout(()=>marking.delete(id),1500));
}
function paintReceipts(){
  if(!cur) return;
  const c=chats.find(x=>x.id===cur.id),others=cur.meta.members.filter(x=>x!==me.uid);
  document.querySelectorAll('#msgs .m.me').forEach(m=>{
    const ts=+m.dataset.ts,k=m.querySelector('.tk');
    if(!k) return;
    const rd=ts&&others.some(x=>(c?.reads?.[x]?.toMillis?.()||0)>=ts);
    k.innerHTML=tickSvg(!!rd);k.classList.toggle('rd',!!rd);

const ACC=['#4f5bd5','#2f80ed','#14b8a6','#27ae60','#f2994a','#e84393','#8e44ad','#e5484d'];

const mq=matchMedia('(prefers-color-scheme: dark)');
function hueSat(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  const l=(mx+mn)/2;
  return [Math.round(h),d?d/(1-Math.abs(2*l-1)):0];
}
function applyPrefs(){
  const root=document.documentElement,ac=pref.theme==='accent';
  const dark=pref.theme==='dark'||ac||(pref.theme==='auto'&&mq.matches);
  root.dataset.theme=dark?'dark':'light';
  root.style.setProperty('--acc',pref.accent);
  if(ac){
    const [h,sat]=hueSat(pref.accent),s=Math.round(Math.min(.45,Math.max(.18,sat*.5))*100);
    const set=(k,l,sa=s)=>root.style.setProperty(k,`hsl(${h} ${sa}% ${l}%)`);
    set('--bg',11);set('--card',16);set('--line',25);set('--inp',20);set('--ink',94,25);set('--mut',68,18);
  }else['--bg','--card','--line','--inp','--ink','--mut'].forEach(k=>root.style.removeProperty(k));
  document.querySelectorAll('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v===pref.theme));
  document.querySelectorAll('#sw2 button').forEach(b=>b.classList.toggle('on',b.dataset.c===pref.accent));
  $('#cc').value=pref.accent;
  try{localStorage.setItem('bobos-pref',JSON.stringify(pref))}catch{}
}

async function ensureProfile(u){
  const login=u.email.split('@')[0],ref=doc(db,'users',u.uid);
  const p=(await getDoc(ref)).data()||{};
  if(p.deleted||p.banned) return p;
  if(!p.bobosId){
    const cref=doc(db,'meta','counter');
    p.bobosId=await runTransaction(db,async t=>{
      const c=await t.get(cref),id=c.exists()?c.data().n+1:1000;
      t.set(cref,{n:id});
      t.set(ref,{bobosId:id,name:login},{merge:true});
      return id;
    });
  }
  if(!p.username){
    let un=login;
    for(let i=0;i<6;i++){
      try{
        const b=writeBatch(db);
        b.set(doc(db,'usernames',un),{uid:u.uid});
        b.set(ref,{username:un,usernameLower:un},{merge:true});
        await b.commit();p.username=un;break;
      }catch{un=login+(100+Math.floor(Math.random()*900))}
    }
  }
  return p;
}

function toAvatar(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const S=128,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8));
    };
    img.onerror=()=>rej(new Error('bad image'));
    img.src=u;
  });
}

  await Promise.all(m.members.map(loadUser));
  box.replaceChildren();
  m.members.forEach(uid=>box.append(item(ucd[uid]?.username||m.names[uid]||'?',uid===m.owner?'владелец группы':uid===me.uid?'это ты':'',' ',false,
    ()=>{$('#gi').close();showProfile(uid)},0,ucd[uid]?.avatar,ucd[uid])));
}
async function openGroupInfo(){
  const m=cur.meta;
  $('#git').textContent=cur.title;
  $('#gav').replaceChildren(av(cur.title,m.avatar));
  $('#ged').classList.toggle('hide',!gOwn());
  $('#gtn').value=cur.title;$('#gaq').value='';$('#gar').replaceChildren();gErr('');
  $('#gi').showModal();
  listMembers();
}
$('#hd').onclick=e=>{
  if(e.target.closest('#back')||!cur) return;
  if(!cur.meta.group) return showProfile(cur.meta.members.find(x=>x!==me.uid));
  openGroupInfo();
};
$('#gsv').onclick=async()=>{
  const t=$('#gtn').value.trim();
  if(!gOwn()) return;
  if(!t) return gErr('Название не может быть пустым');
  try{
    await updateDoc(doc(db,'chats',cur.id),{title:t});
    cur.title=t;cur.meta.title=t;
    $('#git').textContent=t;$('#gav').replaceChildren(av(t,cur.meta.avatar));paintHead();gErr('');
  }catch(x){gErr('Не вышло: '+(x.code||x.message))}
};
async function setGroupAvatar(data){
  try{
    await updateDoc(doc(db,'chats',cur.id),{avatar:data});
    cur.meta.avatar=data;$('#gav').replaceChildren(av(cur.title,data));paintHead();gErr('');
  }catch(x){gErr('Не вышло: '+(x.code||x.message))}
}
$('#gab').onclick=()=>$('#gaf').click();
$('#gad').onclick=()=>{if(gOwn()) setGroupAvatar(null)};
$('#gaf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!gOwn()) return;
  try{await setGroupAvatar(await toAvatar(f))}catch{gErr('Не получилось открыть картинку')}
};
async function addMember(uid,u){
  const m=cur.meta;
  if(!gOwn()) return;
  if(m.members.includes(uid)) return gErr('Уже в группе');
  if(m.members.length>=50) return gErr('Максимум 50 участников');
  try{
    await updateDoc(doc(db,'chats',cur.id),{
      members:arrayUnion(uid),['names.'+uid]:u.username,['unread.'+uid]:increment(1),
      lastText:u.username+' добавлен(а) в группу',lastFrom:me.username,lastUid:me.uid,lastTs:serverTimestamp()
    });
    m.members=[...m.members,uid];m.names={...m.names,[uid]:u.username};
    $('#gaq').value='';$('#gar').replaceChildren();gErr('');
    paintHead();listMembers();
  }catch(x){gErr('Не вышло: '+(x.code||x.message))}
}
let gat;
$('#gaq').oninput=e=>{
  clearTimeout(gat);
  const q=e.target.value.trim().toLowerCase().replace(/^@/,''),box=$('#gar');
  if(!q) return box.replaceChildren();
  gat=setTimeout(async()=>{
    const us=(await findUsers(q)).filter(d=>!cur.meta.members.includes(d.id));
    box.replaceChildren();
    if(!us.length) return box.append(el('div','none','Никого не нашли'));
    us.forEach(d=>{const u=d.data();box.append(item(u.username,'ID '+u.bobosId,'',false,()=>addMember(d.id,u),0,u.avatar,u))});
  },250);
};
$('#gtn').onkeydown=$('#gaq').onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();if(e.target.id==='gtn')$('#gsv').click()}
};

/* ---------- старт ---------- */
function stopAll(){
  unChats&&unChats();unMsgs&&unMsgs();unMe&&unMe();
  clearInterval(hb);clearInterval(tick);
  Object.values(unU).forEach(f=>f());
  for(const k in unU) delete unU[k];
  for(const k in lts) delete lts[k];
}
onAuthStateChanged(auth,async u=>{
  stopAll();
  if(!u){
    me=null;cur=null;chats=[];unread={};badge();
    $('#app').classList.add('hide');$('#auth').classList.remove('hide');
    return;
  }
  let p;
  try{p=await ensureProfile(u)}catch(x){console.error(x);$('#err').textContent='Не удалось загрузить профиль: '+(x.code||x.message);signOut(auth);return}
  if(p.deleted){$('#err').textContent='Этот аккаунт удалён';signOut(auth);return}
  if(p.banned){$('#err').textContent='Ваш аккаунт заблокирован';signOut(auth);return}
  me={uid:u.uid,username:p.username,id:p.bobosId,trusted:!!p.trusted,admin:!!p.admin,frozen:!!p.frozen,avatar:p.avatar||null};
  ucd[u.uid]=p;
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  $('#me').textContent='@'+me.username;
  paintFrozen();
  $('#ad').classList.toggle('hide',!(me.id===ADMIN||me.admin));

  unMe=onSnapshot(doc(db,'users',u.uid),s=>{
    if(!me) return;
    const d=s.data()||{};ucd[u.uid]=d;
    me.admin=!!d.admin;me.trusted=!!d.trusted;me.frozen=!!d.frozen;
    if(d.deleted){$('#err').textContent='Этот аккаунт удалён';signOut(auth);return}
    paintFrozen();
    if(d.banned){$('#err').textContent='Ваш аккаунт заблокирован';signOut(auth);return}
    $('#ad').classList.toggle('hide',!(me.id===ADMIN||me.admin));
  },()=>{});
  beat();hb=setInterval(beat,60000);
  tick=setInterval(()=>{paintHead();if(!$('#q').value)renderList()},30000);

  let first=true;
  unChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data()}));
    chats.forEach(c=>{if(c.type!=='group') watch(c.members.find(x=>x!==me.uid))});
    chats.filter(c=>c.type==='group'&&c.lastUid&&!ucd[c.lastUid]).forEach(c=>loadUser(c.lastUid).then(()=>{if(!$('#q').value)renderList()}));
    const cc=cur&&chats.find(x=>x.id===cur.id);
    if(cc&&cc.type==='group'){
      cur.title=cc.title||cur.title;
      cur.meta={members:cc.members,names:cc.names,group:true,title:cc.title,avatar:cc.avatar,owner:cc.owner};
      paintHead();
    }
    unread={};
    chats.forEach(c=>{
      const n=c.unread?.[me.uid]||0;
      if(!n) return;
      if(cur?.id===c.id&&!document.hidden) markRead(c.id); else unread[c.id]=n;
    });
    badge();
    s.docChanges().forEach(ch=>{
      const d=ch.doc.data(),t=d.lastTs?.toMillis?.()||0;
      if(!first&&ch.type!=='removed'&&d.lastUid&&d.lastUid!==me.uid&&t&&t!==lts[ch.doc.id]&&!ch.doc.metadata.hasPendingWrites)
        loadUser(d.lastUid).then(u=>notify(ch.doc.id,(d.type==='group'?d.title+' · ':'')+(u.username||d.lastFrom||'bobos'),d.lastText||''));
      lts[ch.doc.id]=t;
    });
    first=false;
    if(!$('#q').value) renderList();
    paintReceipts();
  },console.error);

  emptyView();
});
</script>
